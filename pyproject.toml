[project]
name = "rna"
version = "0.2.0"
description = "Identity and open-reading-frame grammar for synthetic RNA."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "wetware", email = "hellowetware@gmail.com" }]
keywords = ["RNA", "mRNA", "synthetic biology"]
classifiers = [
  "Intended Audience :: Science/Research",
  "Topic :: Scientific/Engineering :: Bio-Informatics",
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/wetwarehq/rna"
Repository = "https://github.com/wetwarehq/rna"

[project.scripts]
rna = "rna.cli:main"
rn01 = "rna.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel.force-include]
"src/rna/auth/mini-orf-a.fa" = "rna/auth/mini-orf-a.fa"

[tool.hatch.build.targets.sdist]
include = [
  "/src",
  "/tests",
  "/cards",
  "/README.md",
  "/LICENSE",
  "/uv.lock",
]
